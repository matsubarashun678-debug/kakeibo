<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>家計簿入力</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #141927;
    --surface2: #1c2235;
    --surface3: #252b42;
    --border: #2d3555;
    --text: #e8ecf4;
    --text-muted: #7b84a3;
    --accent: #6ee7b7;
    --accent-dim: rgba(110, 231, 183, 0.12);
    --accent-glow: rgba(110, 231, 183, 0.25);
    --warn: #fbbf24;
    --error: #f87171;
    --success: #6ee7b7;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .app {
    max-width: 440px;
    margin: 0 auto;
    padding: 20px 16px;
    padding-top: calc(env(safe-area-inset-top, 20px) + 8px);
    padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 24px);
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon {
    width: 36px; height: 36px;
    background: var(--accent-dim);
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .logout-btn:active { background: var(--surface2); }

  /* Login */
  .login-card {
    text-align: center;
    padding: 60px 24px;
  }
  .login-icon {
    font-size: 48px;
    margin-bottom: 20px;
    opacity: 0.8;
  }
  .login-card h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .login-card p {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .login-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .login-btn:active { transform: scale(0.96); opacity: 0.9; }

  /* Section Labels */
  .section-label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  /* Date Picker */
  .date-section { margin-bottom: 24px; }
  .date-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .date-input:focus { border-color: var(--accent); }

  /* Category Grid */
  .category-section { margin-bottom: 24px; }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .cat-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 12px 4px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.3;
  }
  .cat-btn:active { transform: scale(0.95); }
  .cat-btn.selected {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* Amount Input */
  .amount-section { margin-bottom: 20px; }
  .amount-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .yen-sign {
    position: absolute;
    left: 16px;
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .amount-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    padding: 16px 16px 16px 40px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .amount-input:focus { border-color: var(--accent); }
  .amount-input::placeholder { color: var(--surface3); }

  /* Quick Amount Buttons */
  .quick-amounts {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .quick-btn {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 0;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-btn:active { background: var(--surface3); color: var(--text); }

  /* Submit */
  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    margin-bottom: 28px;
    letter-spacing: 0.02em;
  }
  .submit-btn:active { transform: scale(0.97); opacity: 0.9; }
  .submit-btn:disabled {
    background: var(--surface3);
    color: var(--text-muted);
    cursor: not-allowed;
    transform: none;
    opacity: 1;
  }

  /* History */
  .history-section { margin-top: 8px; }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    border-left: 3px solid var(--accent);
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .history-cat {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .history-amount {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
  }
  .history-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: 8px;
  }
  .history-empty {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 16px) + 24px);
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    color: var(--text);
    padding: 14px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    transition: transform 0.3s ease;
    z-index: 100;
    white-space: nowrap;
    border: 1px solid var(--border);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent); }
  .toast.error { border-color: var(--error); }

  /* Loading overlay */
  .loading {
    position: fixed;
    inset: 0;
    background: rgba(10,14,26,0.8);
    display: grid;
    place-items: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--surface3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    margin-top: 16px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .loading-inner { text-align: center; }

  /* Error display */
  .error-box {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--error);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CLIENT_ID = 'ada8076c-5d33-4fe0-b148-5362413e468f';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = 'Files.ReadWrite';
const FILE_PATH = '/個人PL_2026.xlsx';
const SHEET_NAME = '家計簿(実績)';

// Date column = C, Header row = 6, Data starts at row 7
const DATE_COL = 'C';
const DATA_START_ROW = 7;

// Category -> Excel column (T~AD)
const CATEGORIES = [
  { name: '食費',       col: 'T' },
  { name: '日用品費',   col: 'U' },
  { name: '娯楽費',     col: 'V' },
  { name: '交際費',     col: 'W' },
  { name: '交通費',     col: 'X' },
  { name: '教育費',     col: 'Y' },
  { name: '医療費',     col: 'Z' },
  { name: '水道光熱費', col: 'AA' },
  { name: '通信費',     col: 'AB' },
  { name: '特別費',     col: 'AC' },
  { name: '雑費',       col: 'AD' },
];

// ============================================================
// State
// ============================================================
let accessToken = null;
let selectedCategory = null;
let sessionHistory = [];
let isLoading = false;
let errorMsg = null;

// ============================================================
// Auth
// ============================================================
function getAuthUrl() {
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'token',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    response_mode: 'fragment',
  });
  return `https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize?${params}`;
}

function checkAuthRedirect() {
  const hash = window.location.hash;
  if (hash.includes('access_token')) {
    const params = new URLSearchParams(hash.substring(1));
    accessToken = params.get('access_token');
    window.history.replaceState(null, '', window.location.pathname);
    return true;
  }
  return false;
}

function login() { window.location.href = getAuthUrl(); }
function logout() { accessToken = null; selectedCategory = null; render(); }

// ============================================================
// Graph API helpers
// ============================================================
const GRAPH_BASE = 'https://graph.microsoft.com/v1.0/me/drive/root:';

async function graphGet(url) {
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API Error ${res.status}`);
  }
  return res.json();
}

async function graphPatch(url, body) {
  const res = await fetch(url, {
    method: 'PATCH',
    headers: {
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API Error ${res.status}`);
  }
  return res.json();
}

// ============================================================
// Excel date helpers
// ============================================================
function jsDateToExcelSerial(d) {
  // Excel epoch: 1899-12-30 (accounting for the 1900 leap year bug)
  const epoch = new Date(Date.UTC(1899, 11, 30));
  const utcDate = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const diff = utcDate.getTime() - epoch.getTime();
  return Math.round(diff / 86400000);
}

// ============================================================
// Core: Find date row and add amount
// ============================================================
async function addExpense(dateStr, categoryCol, amount) {
  const encodedPath = encodeURIComponent(FILE_PATH);
  const encodedSheet = encodeURIComponent(SHEET_NAME);

  // Parse selected date
  const [y, m, d] = dateStr.split('-').map(Number);
  const targetDate = new Date(y, m - 1, d);
  const targetSerial = jsDateToExcelSerial(targetDate);

  // Read date column (C7:C400 should cover a full year)
  const rangeAddr = `${DATE_COL}${DATA_START_ROW}:${DATE_COL}400`;
  const url = `${GRAPH_BASE}${encodedPath}:/workbook/worksheets('${encodedSheet}')/range(address='${rangeAddr}')`;
  const dateData = await graphGet(url);

  // Find matching row
  let matchRow = -1;
  const values = dateData.values || [];
  for (let i = 0; i < values.length; i++) {
    const cellVal = values[i][0];
    if (cellVal === null || cellVal === '') continue;

    let cellSerial;
    if (typeof cellVal === 'number') {
      cellSerial = Math.round(cellVal);
    } else {
      // Try parsing as date string
      const parsed = new Date(cellVal);
      if (!isNaN(parsed)) {
        cellSerial = jsDateToExcelSerial(parsed);
      } else {
        continue;
      }
    }

    if (cellSerial === targetSerial) {
      matchRow = DATA_START_ROW + i;
      break;
    }
  }

  if (matchRow === -1) {
    throw new Error(`${y}/${m}/${d} の行が見つかりません。Excelに該当日付の行が存在するか確認してください。`);
  }

  // Read current value of the category cell
  const cellAddr = `${categoryCol}${matchRow}`;
  const cellUrl = `${GRAPH_BASE}${encodedPath}:/workbook/worksheets('${encodedSheet}')/range(address='${cellAddr}')`;
  const cellData = await graphGet(cellUrl);

  const currentVal = cellData.values?.[0]?.[0];
  const currentNum = (typeof currentVal === 'number') ? currentVal : 0;
  const newVal = currentNum + amount;

  // Write back
  await graphPatch(cellUrl, { values: [[newVal]] });

  return { matchRow, currentNum, newVal };
}

// ============================================================
// UI helpers
// ============================================================
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => { el.className = 'toast'; }, 2800);
}

function showLoading(msg) {
  isLoading = true;
  const overlay = document.createElement('div');
  overlay.className = 'loading';
  overlay.id = 'loadingOverlay';
  overlay.innerHTML = `<div class="loading-inner"><div class="spinner"></div><div class="loading-text">${msg}</div></div>`;
  document.body.appendChild(overlay);
}

function hideLoading() {
  isLoading = false;
  const el = document.getElementById('loadingOverlay');
  if (el) el.remove();
}

function selectCategory(idx) {
  selectedCategory = idx;
  render();
}

function addQuickAmount(val) {
  const input = document.getElementById('amountInput');
  if (!input) return;
  const current = parseInt(input.value) || 0;
  input.value = current + val;
}

async function submit() {
  const dateInput = document.getElementById('dateInput');
  const amountInput = document.getElementById('amountInput');
  if (selectedCategory === null) { showToast('カテゴリを選択してください', 'error'); return; }
  const amount = parseInt(amountInput.value);
  if (!amount || amount <= 0) { showToast('金額を入力してください', 'error'); return; }

  const cat = CATEGORIES[selectedCategory];
  const dateStr = dateInput.value;

  showLoading('書き込み中...');
  errorMsg = null;

  try {
    const result = await addExpense(dateStr, cat.col, amount);
    sessionHistory.unshift({
      date: dateStr,
      category: cat.name,
      amount: amount,
      prev: result.currentNum,
      now: result.newVal,
      time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
    });
    showToast(`✓ ${cat.name} +¥${amount.toLocaleString()}`, 'success');
    // Reset amount only (keep date & category for consecutive entries)
    amountInput.value = '';
  } catch (e) {
    errorMsg = e.message;
    showToast('エラーが発生しました', 'error');
  } finally {
    hideLoading();
    render();
  }
}

// ============================================================
// Render
// ============================================================
function render() {
  const app = document.getElementById('app');

  if (!accessToken) {
    app.innerHTML = `
      <div class="login-card">
        <div class="login-icon">📒</div>
        <h2>家計簿入力</h2>
        <p>OneDriveのExcelファイルに<br>直接書き込みます</p>
        <button class="login-btn" onclick="login()">
          Microsoftでログイン
        </button>
      </div>
    `;
    return;
  }

  const today = new Date();
  const todayStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  const dateVal = document.getElementById('dateInput')?.value || todayStr;
  const amountVal = document.getElementById('amountInput')?.value || '';

  app.innerHTML = `
    <div class="header">
      <div class="header-left">
        <div class="header-icon">📒</div>
        <h1>家計簿入力</h1>
      </div>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>

    ${errorMsg ? `<div class="error-box">${errorMsg}</div>` : ''}

    <div class="date-section">
      <span class="section-label">日付</span>
      <input type="date" class="date-input" id="dateInput" value="${dateVal}">
    </div>

    <div class="category-section">
      <span class="section-label">カテゴリ</span>
      <div class="category-grid">
        ${CATEGORIES.map((c, i) => `
          <button class="cat-btn ${selectedCategory === i ? 'selected' : ''}"
                  onclick="selectCategory(${i})">${c.name}</button>
        `).join('')}
      </div>
    </div>

    <div class="amount-section">
      <span class="section-label">金額</span>
      <div class="amount-wrapper">
        <span class="yen-sign">¥</span>
        <input type="number" class="amount-input" id="amountInput"
               placeholder="0" inputmode="numeric" value="${amountVal}">
      </div>
      <div class="quick-amounts">
        <button class="quick-btn" onclick="addQuickAmount(100)">+100</button>
        <button class="quick-btn" onclick="addQuickAmount(500)">+500</button>
        <button class="quick-btn" onclick="addQuickAmount(1000)">+1K</button>
        <button class="quick-btn" onclick="addQuickAmount(5000)">+5K</button>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submit()"
            ${selectedCategory === null ? 'disabled' : ''}>
      加算する
    </button>

    <div class="history-section">
      <span class="section-label">今回の入力履歴</span>
      ${sessionHistory.length === 0 ?
        '<div class="history-empty">まだ入力がありません</div>' :
        sessionHistory.map(h => `
          <div class="history-item">
            <div>
              <span class="history-cat">${h.category}</span>
              <span class="history-date">${h.date} ${h.time}</span>
            </div>
            <span class="history-amount">+¥${h.amount.toLocaleString()}</span>
          </div>
        `).join('')
      }
    </div>
  `;

  // Restore input values after render
  const di = document.getElementById('dateInput');
  if (di && !di.value) di.value = todayStr;
}

// ============================================================
// Init
// ============================================================
checkAuthRedirect();
render();
</script>
</body>
</html>
